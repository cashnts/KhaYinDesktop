name: KhaYin Desktop Multi-Platform Release (macOS & Windows)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Choose platform to compile and upload'
        required: true
        type: choice
        options:
          - all
          - macos
          - windows
        default: all
      version_override:
        description: 'Optional version tag override (e.g. 1.0.0 or 1). Leave empty to use DesktopVersion.properties'
        required: false
        type: string
        default: ''
      upload_to_r2:
        description: 'Upload release artifacts to Cloudflare R2'
        required: true
        type: boolean
        default: true
      create_github_release:
        description: 'Publish or update GitHub Release'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: khayin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve Version Metadata
  # ---------------------------------------------------------------------------
  metadata:
    name: Resolve Version Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      clean_version: ${{ steps.version_step.outputs.clean_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            RAW_VERSION="${{ inputs.version_override }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          elif [ -f "composeApp/Configuration/DesktopVersion.properties" ]; then
            RAW_VERSION=$(grep "^VERSION_NAME=" composeApp/Configuration/DesktopVersion.properties | cut -d'=' -f2 | tr -d '\r\n')
          else
            RAW_VERSION="1.0.0"
          fi
          
          CLEAN_VERSION=$(echo "${RAW_VERSION}" | tr -cd '[:alnum:]._-')
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${CLEAN_VERSION}"

  # ---------------------------------------------------------------------------
  # 2. Build macOS (Apple Silicon ARM64)
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (ARM64)
    needs: metadata
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch Git LFS Objects
        run: git lfs pull

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS Release DMG
        run: |
          ./gradlew packageReleaseDmg -Pnuvio.android.distribution=full --no-configuration-cache --stacktrace

      - name: Rename and Prepare macOS Artifact
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          mkdir -p dist
          
          DMG_FILE=$(find composeApp/build/compose -type f -name "*.dmg" | head -n 1)
          if [ -f "$DMG_FILE" ]; then
            cp "$DMG_FILE" "dist/khayin-arm-v${VERSION}.dmg"
            echo "Created dist/khayin-arm-v${VERSION}.dmg"
          else
            echo "Error: DMG file not found!" >&2
            exit 1
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Build Windows (x64 MSI)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (x64)
    needs: metadata
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch Git LFS Objects
        run: git lfs pull

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up WiX Toolset
        run: |
          dotnet tool install --global wix || true

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version 1.0.2903.40 `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache

          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.1.0.2903.40"
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows Release Package
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.android.distribution=full" `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --stacktrace

      - name: Rename and Prepare Windows Artifact
        shell: bash
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          mkdir -p dist
          
          MSI_FILE=$(find composeApp/build/compose -type f -name "*.msi" | head -n 1)
          
          if [ -f "$MSI_FILE" ]; then
            cp "$MSI_FILE" "dist/khayin-win-v${VERSION}.msi"
            echo "Created dist/khayin-win-v${VERSION}.msi"
          else
            echo "Error: No Windows MSI built!" >&2
            exit 1
          fi

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Collect, Upload to Cloudflare R2 & Publish Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Upload to Cloudflare R2 & Publish Release
    needs: [metadata, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: always() && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: List Collected Release Files
        run: |
          mkdir -p release-files
          cp -r all-artifacts/* release-files/ 2>/dev/null || true
          echo "=== Collected Release Artifacts ==="
          ls -la release-files/

      # Upload to Cloudflare R2 using AWS CLI with custom S3 endpoint
      - name: Upload to Cloudflare R2 Bucket
        if: ${{ (inputs.upload_to_r2 != false) }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          MISSING=0
          if [ -z "${R2_ACCOUNT_ID}" ]; then echo "::warning ::Secret R2_ACCOUNT_ID is empty or not found in repository secrets."; MISSING=1; fi
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then echo "::warning ::Secret R2_ACCESS_KEY_ID is empty or not found in repository secrets."; MISSING=1; fi
          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then echo "::warning ::Secret R2_SECRET_ACCESS_KEY is empty or not found in repository secrets."; MISSING=1; fi
          if [ -z "${R2_BUCKET_NAME}" ]; then echo "::warning ::Secret R2_BUCKET_NAME is empty or not found in repository secrets."; MISSING=1; fi
          
          if [ "$MISSING" -eq 1 ]; then
            echo "Error: Cloudflare R2 secrets are missing. Skipping R2 upload."
            exit 1
          fi
          
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TARGET_DIR="v${VERSION}"
          
          echo "Uploading release artifacts to Cloudflare R2: s3://${R2_BUCKET_NAME}/${TARGET_DIR}/"
          
          for file in release-files/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading $filename -> s3://${R2_BUCKET_NAME}/${TARGET_DIR}/${filename}"
              aws s3 cp "$file" "s3://${R2_BUCKET_NAME}/${TARGET_DIR}/${filename}" \
                --endpoint-url "${R2_ENDPOINT}" \
                --region auto
            fi
          done
          
          echo "Cloudflare R2 upload completed successfully!"

      # Create GitHub Release with binaries attached
      - name: Create GitHub Release
        if: ${{ (inputs.create_github_release != false) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.metadata.outputs.version }}"
          name: "KhaYin v${{ needs.metadata.outputs.version }}"
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
